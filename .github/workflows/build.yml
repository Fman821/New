name: Flutter Build & Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Generate Android Platform Files
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.aistudio.nurazkar
          echo "android.newDsl=false" >> android/gradle.properties

      - name: Configure Android App Name and Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Amharic Azkar"/g' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Amharic Azkar</string>
          </resources>
          EOF
          if [ -d "res_icons" ]; then
            cp -rf res_icons/* android/app/src/main/res/
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Analyze Project Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amharic-azkar-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
